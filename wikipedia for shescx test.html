<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PAGINA</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow: hidden;
    }

    /* Frame da Wikipédia ocupando a tela inteira */
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Botão azul pequeno e sem neon no canto inferior esquerdo */
    .corner-blue-btn {
      position: fixed;
      bottom: 16px;
      left: 16px;
      width: 58px;
      height: 26px;
      background-color: #0d2b6b;
      border: none;
      border-radius: 999px;
      z-index: 9999;
      cursor: pointer;
    }
    .corner-blue-btn:hover {
      background-color: #143d94;
    }
  </style>
</head>
<body>

  <!-- Iframe da Wikipédia -->
  <iframe 
    src="https://wikipedia.org" 
    allowfullscreen>
  </iframe>

  <!-- Botão azul no canto inferior esquerdo -->
  <a 
    class="corner-blue-btn" 
    href="https://6shescx.my.canva.site/shescx6/" 
    target="_blank" 
    rel="noopener"
    aria-label="Abrir site">
  </a>

</body>
</html>
